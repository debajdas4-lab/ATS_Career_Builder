# ---------------------------------------------------------------------------
# Local / on-prem deployment: API + UI as two containers from one image.
#   docker compose up --build
#   UI  -> http://localhost:8501
#   API -> http://localhost:8000
# Configure Azure AD SSO and the optional LLM via a local `.env` file.
# ---------------------------------------------------------------------------
services:
  api:
    build: .
    image: ats-career-builder:latest
    environment:
      SERVICE: api
      PORT: "8000"
      # Auth (set AUTH_ENABLED=true in .env to turn SSO on)
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_API_SCOPE: ${AZURE_API_SCOPE:-}
      AUTH_ALLOWED_USERS: ${AUTH_ALLOWED_USERS:-}
      AUTH_ALLOWED_GROUPS: ${AUTH_ALLOWED_GROUPS:-}
      # Optional LLM
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build: .
    image: ats-career-builder:latest
    depends_on:
      - api
    environment:
      SERVICE: ui
      PORT: "8501"
      RESUME_API_URL: "http://api:8000"
      # UI-side confidential client for the Authorization Code flow
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_UI_CLIENT_ID: ${AZURE_UI_CLIENT_ID:-${AZURE_CLIENT_ID:-}}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-http://localhost:8501}
      AZURE_API_SCOPE: ${AZURE_API_SCOPE:-}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
